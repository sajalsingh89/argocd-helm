
apiVersion: argoproj.io/v1alpha1
kind: Application

metadata:
  name: argocd-learning
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/sajalsingh89/argocd-helm.git
    targetRevision: main
    path: helm/argocd-helm

    helm:
      releaseName: argocd-helm
      valueFiles:
        - values.yaml
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: argocd-learning

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
