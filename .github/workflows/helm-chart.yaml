```yaml
name: Validate and Package Helm Chart

on:
  push:
    branches:
      - main
    paths:
      - 'helm/argocd-helm/**'
      - '.github/workflows/helm-chart.yaml'

  pull_request:
    branches:
      - main
    paths:
      - 'helm/argocd-helm/**'
      - '.github/workflows/helm-chart.yaml'

  workflow_dispatch:

permissions:
  contents: read

jobs:
  helm:
    name: Validate and Package
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Check Helm version
        run: helm version

      - name: Lint Helm chart
        run: helm lint ./helm/argocd-helm

      - name: Render Kubernetes manifests
        run: |
          helm template argocd-helm ./helm/argocd-helm \
            --namespace argocd-helm

      - name: Package Helm chart
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p dist
          helm package ./helm/argocd-helm \
            --destination ./dist

      - name: Upload packaged Helm chart
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: argocd-helm-chart
          path: dist/*.tgz
          if-no-files-found: error
          retention-days: 30
```
